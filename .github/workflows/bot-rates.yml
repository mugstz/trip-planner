name: Update BOT exchange rates

on:
  schedule:
    - cron: "30 11 * * 1-5"   # จันทร์–ศุกร์ 18:30 เวลาไทย (ธปท. ประกาศ 18:00)
  workflow_dispatch:           # กดรันเองได้ที่แท็บ Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch rates from Bank of Thailand
        env:
          BOT_API_TOKEN: ${{ secrets.BOT_API_TOKEN }}
        run: node trip-planner/scripts/fetch-bot-rates.mjs

      - name: Save to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trip-planner/data/bot-rates.json
          git diff --cached --quiet || git commit -m "Update BOT exchange rates"
          git push
